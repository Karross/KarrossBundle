services:
  php:
    build: .
    image: karross/karross-bundle:dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      APP_ENV: test
      # Persist Composer's package cache on the host (var/composer is gitignored):
      # `composer update` becomes near-instant on subsequent runs, locally AND in CI.
      COMPOSER_CACHE_DIR: /app/var/composer
