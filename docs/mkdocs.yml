extra:
  generator: false
# Port dev : 8000/8080 sont réservés aux apps de démo du bundle (make serve)
dev_addr: 127.0.0.1:8001
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css