name: CI

on:
  push:
    branches: [main]
  pull_request:

# Single job mirroring the local workflow (`make all-check`, plus the E2E
# browser install that the full `test` suite needs). Kept sequential: the test
# suite is tiny (~seconds), so the real cost is environment prep, which we do
# once per run and speed up with caches:
#   - Docker layer cache (gha)     -> `make build` is fast on hit
#   - Composer package cache       -> `make update` reuses downloaded packages
#   - Playwright browser cache     -> `make e2e-browsers` reuses Chromium
# Prep + checks run in the same container image as local dev -> no CI drift.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare environment (image + deps)
        uses: ./.github/actions/php-env

      - name: Cache Playwright browsers (var/ms-playwright)
        uses: actions/cache@v5
        with:
          path: var/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: make e2e-browsers

      # Chromium writes root-owned files (rpm.deps/deb.deps) into the bind-mount,
      # which the non-root runner user cannot read when the cache tar runs at the
      # end of the job -> "Failed to save: tar exit code 2". Make everything under
      # the browser dir traversable/readable so the actions/cache save succeeds.
      - name: Fix Playwright browser permissions
        run: docker compose run --rm php sh -c 'chmod -R a+rX /app/var/ms-playwright'

      # Mirrors `make all-check` (cs-fix-check -> phpstan -> test); `make test`
      # runs both the integration and e2e PHPUnit suites.
      - name: Code style check (no modifications)
        run: make cs-fix-check

      - name: Static analysis (phpstan, level max)
        run: make phpstan

      - name: Run test suite (integration + e2e)
        run: make test