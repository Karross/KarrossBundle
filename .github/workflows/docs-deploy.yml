name: docs-deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site (strict)
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build --config-file docs/mkdocs.yml --strict

      - name: Deploy to Karross/karross.github.io (main)
        env:
          DEPLOY_KEY: ${{ secrets.KARROSS_DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/karross_deploy_key
          chmod 600 /tmp/karross_deploy_key
          export GIT_SSH_COMMAND="ssh -i /tmp/karross_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          rm -rf /tmp/site-deploy && mkdir /tmp/site-deploy && cd /tmp/site-deploy
          git init
          git symbolic-ref HEAD refs/heads/main
          cp -r "$GITHUB_WORKSPACE"/docs/site/* .
          touch .nojekyll
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add site git@github.com:Karross/karross.github.io.git
          git push --force --no-thin site HEAD:main